name: fetch-data

# Downloads the source datasets on GitHub's runner (which can reach LandsD, CSDI and
# Overpass), converts them to HK1980 Grid 10 km tiles and commits them under data/.
# Each dataset is fetched and committed in its own step, so a slow or failing source
# never holds back the others. Progress and errors are posted as run annotations.

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated: dtm5m, buildings, osm"
        default: "dtm5m,buildings,osm"
        required: true
      force:
        description: "Refetch even if already up to date"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - config/sources.yml
      - tools/fetch.py
      - .github/workflows/fetch-data.yml
      - .github/commit-data.sh

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

env:
  DATASETS: ${{ inputs.datasets || 'dtm5m,buildings,osm' }}
  FORCE: ${{ inputs.force && '--force' || '' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Check out the branch tip, not the triggering commit, so a queued run sees data
      # committed by the run before it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch dtm5m
        id: dtm5m
        if: ${{ !cancelled() && contains(env.DATASETS, 'dtm5m') }}
        run: python tools/fetch.py --datasets dtm5m $FORCE

      - name: Commit dtm5m
        if: ${{ !cancelled() && steps.dtm5m.outcome == 'success' }}
        run: bash .github/commit-data.sh dtm5m

      - name: Fetch buildings
        id: buildings
        if: ${{ !cancelled() && contains(env.DATASETS, 'buildings') }}
        run: python tools/fetch.py --datasets buildings $FORCE

      - name: Commit buildings
        if: ${{ !cancelled() && steps.buildings.outcome == 'success' }}
        run: bash .github/commit-data.sh buildings

      - name: Fetch osm
        id: osm
        if: ${{ !cancelled() && contains(env.DATASETS, 'osm') }}
        timeout-minutes: 75
        run: python tools/fetch.py --datasets osm $FORCE

      - name: Commit osm
        if: ${{ !cancelled() && steps.osm.outcome == 'success' }}
        run: bash .github/commit-data.sh osm
