# Data sources for tools/fetch.py, run by .github/workflows/fetch-data.yml.
# Everything written to data/ is in HK1980 Grid (EPSG:2326), cut into 10 km tiles
# so no file comes near GitHub's 100 MB per-file limit.

crs: EPSG:2326
tile_size_m: 10000
# minx, miny, maxx, maxy in HK1980 Grid. Covers HKSAR land from Fan Lau to Tung Ping Chau
# and Lok Ma Chau to Po Toi, with margin.
hk_bounds_hk80: [795000, 795000, 875000, 850000]

dtm5m:
  # LandsD 5 m Digital Terrain Model, whole territory, zipped ESRI ASCII grid.
  # Source page: https://data.gov.hk/en-data/dataset/hk-landsd-openmap-5m-grid-dtm
  url: https://www.landsd.gov.hk/landsd_psi_data/SMO/data/Whole_HK_DTM_5m.zip
  # If the runner can't reach LandsD, download the zip yourself, attach it to a release
  # of this repo (tag: src), and use this instead:
  # url: gh-release:src/Whole_HK_DTM_5m.zip

buildings:
  # LandsD "Building" dataset on CSDI (dataset id landsd_rcd_1637211194312_35158):
  # footprints with building height / top and base level / storeys, updated monthly.
  # Paste the ArcGIS REST layer URL from the dataset page on portal.csdi.gov.hk
  # (Other Resources and Services > GeoSpatial Service > ArcGIS REST API).
  # It ends in /FeatureServer/<n> or /MapServer/<n>. Leave null to skip.
  url: null

osm:
  # Roads, tracks, footpaths and masts/towers from OpenStreetMap, for site access
  # and for spotting existing telecom sites. Data (c) OpenStreetMap contributors, ODbL.
  overpass_url: https://overpass-api.de/api/interpreter
