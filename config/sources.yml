# Data sources for tools/fetch.py, run by .github/workflows/fetch-data.yml.
# Everything written to data/ is in HK1980 Grid (EPSG:2326), cut into 10 km tiles
# so no file comes near GitHub's 100 MB per-file limit.

crs: EPSG:2326
tile_size_m: 10000
# minx, miny, maxx, maxy in HK1980 Grid. Covers HKSAR land from Fan Lau to Tung Ping Chau
# and Lok Ma Chau to Po Toi, with margin.
hk_bounds_hk80: [795000, 795000, 875000, 850000]

dtm5m:
  # LandsD 5 m Digital Terrain Model, whole territory, zipped ESRI ASCII grid.
  # Source page: https://data.gov.hk/en-data/dataset/hk-landsd-openmap-5m-grid-dtm
  url: https://www.landsd.gov.hk/landsd_psi_data/SMO/data/Whole_HK_DTM_5m.zip
  # If the runner can't reach LandsD, download the zip yourself, attach it to a release
  # of this repo (tag: src), and use this instead:
  # url: gh-release:src/Whole_HK_DTM_5m.zip

buildings:
  # LandsD "Building" dataset on CSDI (dataset id landsd_rcd_1637211194312_35158):
  # footprints with building height / top and base level / storeys, updated monthly.
  # ArcGIS REST service from the dataset page on portal.csdi.gov.hk (Other Resources and
  # Services > GeoSpatial Service > ArcGIS REST API). A service root is fine: the fetch picks
  # its building polygon layer. Leave null to skip.
  url: https://portal.csdi.gov.hk/server/rest/services/common/landsd_rcd_1637211194312_35158/FeatureServer

osm:
  # Geofabrik's daily Hong Kong extract: roads, tracks, footpaths (site access), masts and
  # towers (existing telecom sites), named peaks with heights (labels and a DTM check).
  # Data (c) OpenStreetMap contributors, ODbL. Overpass was tried first; it refuses or
  # times out from GitHub's runners.
  pbf_url: https://download.geofabrik.de/asia/china/hong-kong-latest.osm.pbf

landuse:
  # PlanD "Raster Grids on Land Utilization", 10 m, HK1980 Grid. 2025 edition, CSDI dataset
  # pland_rcd_1754559265139_25057. Class names come from the map service's legend.
  year: 2025
  url: https://portal.csdi.gov.hk/csdi-webpage/download/common/033207986b097394353ad44a143c54e064743338ec28f784748d77bbdb33afda
  legend_url: https://portal.csdi.gov.hk/server/rest/services/common/pland_rcd_1754559265139_25057/MapServer/legend?f=pjson

canopy:
  # Meta / WRI High Resolution Canopy Height Maps v1: ~1.2 m, EPSG:3857, metres (uint8), CC BY 4.0.
  # The two zoom-9 tiles that cover Hong Kong (quadkeys 132122223 and 132122232).
  urls:
    - https://dataforgood-fb-data.s3.amazonaws.com/forests/v1/alsgedi_global_v6_float/chm/132122223.tif
    - https://dataforgood-fb-data.s3.amazonaws.com/forests/v1/alsgedi_global_v6_float/chm/132122232.tif
